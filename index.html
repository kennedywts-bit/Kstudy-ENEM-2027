/* KSTUDY 1.2 — monochrome interface with vivid section colors */
/* Nunito loaded in the document head. */

:root{
  --bg:#090909;
  --panel:#111111;
  --panel2:#181818;
  --line:#292929;
  --text:#f5f5f5;
  --muted:#a1a1a1;
  --accent:#f2f2f2;
  --accent2:#c9c9c9;
  --red:#ff7777;
  --gold:#f0c36b;
  --blue:#7db7ff;
  --shadow:0 4px 14px #0005;
}
*{box-sizing:border-box}
body{
  background:#090909;
  color:var(--text);
  font-family:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  letter-spacing:.005em;
}
button,input,select,textarea{font-family:inherit}
.sidebar{
  background:#0d0d0d;
  border-right:1px solid #292929;
  box-shadow:none;
}
.brand{padding:8px 10px 26px}
.brandmark{
  border:1px solid #555;
  border-radius:11px;
  background:#f2f2f2;
  color:#090909;
  box-shadow:none;
  font-weight:900;
}
.brand strong{font-weight:900;letter-spacing:.16em}
.brand small{font-weight:800;color:#888}
.navlabel{color:#777;font-weight:900;letter-spacing:.18em;padding:15px 12px 9px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{
  --nav-color:#777;
  position:relative;
  overflow:hidden;
  border:1px solid color-mix(in srgb,var(--nav-color) 48%,#222);
  border-radius:9px;
  padding:11px 12px;
  margin:0;
  color:#fff;
  font-weight:800;
  background:color-mix(in srgb,var(--nav-color) 27%,#111);
  box-shadow:none;
  transition:background .16s,border-color .16s,transform .16s;
}
.nav button::after{content:none}
.nav button .ico{
  width:25px;height:25px;display:grid;place-items:center;
  border-radius:7px;
  color:#fff;
  background:color-mix(in srgb,var(--nav-color) 82%,#111);
  box-shadow:none;
  font-size:15px;font-weight:900;
}
.nav button:hover{
  transform:translateX(2px);
  border-color:var(--nav-color);
  background:color-mix(in srgb,var(--nav-color) 39%,#111);
}
.nav button.active{
  color:#fff;
  border-color:var(--nav-color);
  background:color-mix(in srgb,var(--nav-color) 48%,#111);
  box-shadow:inset 3px 0 0 #fff;
}
.nav button.active .ico{background:#fff;color:#111}
.nav button:nth-of-type(1){--nav-color:#347bd1}
.nav button:nth-of-type(2){--nav-color:#168f7c}
.nav button:nth-of-type(3){--nav-color:#7952b5}
.nav button:nth-of-type(4){--nav-color:#bd7a22}
.nav button:nth-of-type(5){--nav-color:#168da5}
.nav button:nth-of-type(6){--nav-color:#438d45}
.nav button:nth-of-type(7){--nav-color:#b34b68}
.nav button:nth-of-type(8){--nav-color:#bd5732}
.nav button:nth-of-type(9){--nav-color:#6558bd}
.nav button:nth-of-type(10){--nav-color:#9b7923}
.sidefoot{border-color:#292929;color:#888;font-weight:700}
.topbar{
  background:#090909;
  border-color:#292929;
  box-shadow:none;
  backdrop-filter:none;
}
.crumb{font-weight:700;color:#aaa}
.pagehead h1{font-weight:900;letter-spacing:-.035em}
.eyebrow{font-weight:900;color:#aaa}
.card{
  background:#111;
  border:1px solid #292929;
  border-radius:12px;
  box-shadow:none;
}
.card h3{font-weight:900;letter-spacing:.01em}
.statnum{font-weight:900}
.sectiontitle{font-weight:900}
.btn{
  border:1px solid #393939;
  border-radius:8px;
  background:#1a1a1a;
  color:#f5f5f5;
  box-shadow:none;
  font-weight:800;
}
.btn:hover{border-color:#777;transform:none;background:#242424;box-shadow:none}
.btn.primary{
  color:#090909;
  border-color:#f2f2f2;
  background:#f2f2f2;
  box-shadow:none;
}
.btn.danger{color:#ff8585}
input,select,textarea{
  background:#0b0b0b;
  border:1px solid #393939;
  border-radius:8px;
  color:#f5f5f5;
  box-shadow:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#aaa;
  box-shadow:0 0 0 2px #ffffff18;
}
.item{
  background:#151515;
  border:1px solid #303030;
  border-radius:9px;
  box-shadow:none;
}
.pill{border-color:#444;background:#1a1a1a;font-weight:800}
.progress{background:#292929;box-shadow:none}
.progress span{background:#e5e5e5}
.bar{background:#e5e5e5;box-shadow:none}
.chatlog{background:#0b0b0b;border-color:#303030;border-radius:10px}
.bubble{border-radius:10px;font-weight:600}
.bubble.user{background:#262626;border:1px solid #444}
.bubble.bot{background:#151515;border:1px solid #303030}
.toast{border-radius:9px;font-weight:900;background:#f2f2f2;color:#090909;box-shadow:var(--shadow)}
.empty{border-color:#383838}
th{font-weight:900}
@media(max-width:760px){
  .sidebar{background:#0d0d0d;border-right:1px solid #292929}
  .topbar{background:#090909}
}

/* KSTUDY 1.3 — dark graphite, section color on selection only */
:root{
  --bg:#080808;
  --panel:#111111;
  --panel2:#181818;
  --line:#292929;
  --text:#f5f5f5;
  --muted:#a5a5a5;
  --accent:#f4f4f4;
  --accent2:#d8d8d8;
  --shadow:0 5px 18px #0008;
}
html,body{background:#080808}
body{font-family:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif}
button,input,select,textarea{font-family:inherit}
.sidebar{background:#0c0c0c;border-right:1px solid #292929}
.brandmark{background:#f4f4f4;color:#090909;border-color:#f4f4f4;box-shadow:0 3px 12px #ffffff20}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{
  --nav-color:#ffffff;
  border:1px solid transparent;
  background:transparent;
  color:#c9c9c9;
  border-radius:11px;
  padding:11px 12px;
  margin:0;
  font-weight:800;
  box-shadow:none;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .18s;
}
.nav button .ico{
  width:27px;height:27px;display:grid;place-items:center;
  border-radius:8px;background:#1c1c1c;color:#e8e8e8;
  box-shadow:inset 0 1px 0 #ffffff18,0 2px 5px #0008;
}
.nav button:hover{
  background:#171717;border-color:#343434;color:#fff;transform:translateX(2px);
}
.nav button.active{
  color:#fff;
  background:color-mix(in srgb,var(--nav-color) 17%,#101010);
  border-color:color-mix(in srgb,var(--nav-color) 65%,#333);
  box-shadow:inset 3px 0 0 var(--nav-color),0 3px 12px #0008;
}
.nav button.active .ico{
  background:var(--nav-color);color:#080808;
  box-shadow:0 0 12px color-mix(in srgb,var(--nav-color) 42%,transparent);
}
.nav button:nth-of-type(1){--nav-color:#ffffff}
.nav button:nth-of-type(2){--nav-color:#65b9ff}
.nav button:nth-of-type(3){--nav-color:#53d6b0}
.nav button:nth-of-type(4){--nav-color:#b99aff}
.nav button:nth-of-type(5){--nav-color:#f0bd68}
.nav button:nth-of-type(6){--nav-color:#54c8d8}
.nav button:nth-of-type(7){--nav-color:#8bd17c}
.nav button:nth-of-type(8){--nav-color:#f08da8}
.nav button:nth-of-type(9){--nav-color:#ff9a70}
.nav button:nth-of-type(10){--nav-color:#a99cff}
.navlabel{color:#777;font-weight:900}
.topbar{background:#090909;border-color:#292929;box-shadow:none;backdrop-filter:blur(14px)}
.crumb{color:#aaa;font-weight:700}
.pagehead h1,.sectiontitle,.card h3{font-weight:900}
.eyebrow{color:#aaa;font-weight:900}
.card{background:linear-gradient(145deg,#141414,#101010);border:1px solid #292929;border-radius:15px;box-shadow:none}
.btn{border:1px solid #393939;border-radius:10px;background:#1a1a1a;color:#f5f5f5;box-shadow:none;font-weight:800}
.btn:hover{border-color:#777;background:#242424;transform:translateY(-1px)}
.btn.primary{background:#f4f4f4;color:#090909;border-color:#f4f4f4}
input,select,textarea{background:#0b0b0b;border:1px solid #393939;border-radius:10px;color:#f5f5f5}
input:focus,select:focus,textarea:focus{border-color:#aaa;box-shadow:0 0 0 3px #ffffff18}
.item{background:#151515;border:1px solid #303030;border-radius:11px}
.pill{border-color:#444;background:#1a1a1a}
.progress{background:#292929}
.progress span{background:#ededed}
.bar{background:#ededed}
.chatlog{background:#0b0b0b;border-color:#303030}
.bubble{border-radius:12px}
.bubble.user{background:#262626;border:1px solid #444}
.bubble.bot{background:#151515;border:1px solid #303030}
.toast{background:#f2f2f2;color:#090909;border-radius:10px}
.empty{border-color:#383838}

/* A tela inicial recebe apenas um relevo branco discreto nos cards. */
body.home-view .card{
  border-color:#383838;
  box-shadow:0 0 0 1px #ffffff08,0 5px 20px #ffffff0a,0 12px 30px #0009;
}
body.home-view .nav button.active{
  background:#f1f1f1;color:#090909;border-color:#fff;
  box-shadow:0 0 0 1px #ffffff70,0 0 18px #ffffff25;
}
body.home-view .nav button.active .ico{background:#090909;color:#fff;box-shadow:none}
@media(max-width:760px){
  .sidebar{background:#0c0c0c;border-right:1px solid #292929}
  .topbar{background:#090909}
  body.home-view .card{box-shadow:0 0 0 1px #ffffff08,0 5px 18px #ffffff0a,0 10px 24px #0009}
}



/* KSTUDY 1.4 — cada seção assume sua cor ao ser aberta */
body[class*="section-"]{
  --section-color:#65b9ff;
  --section-soft:color-mix(in srgb,var(--section-color) 24%,#080808);
}
body.section-timer{--section-color:#65b9ff}
body.section-routine{--section-color:#53d6b0}
body.section-content{--section-color:#b99aff}
body.section-reviews{--section-color:#f0bd68}
body.section-questions{--section-color:#54c8d8}
body.section-simulados{--section-color:#8bd17c}
body.section-errors{--section-color:#f08da8}
body.section-tools{--section-color:#ff9a70}
body.section-mentor{--section-color:#a99cff}

/* O fundo da área de trabalho fica visivelmente tingido pela cor da seção. */
body[class*="section-"] .main{
  background:
    radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--section-color) 30%,transparent),transparent 62%),
    #080808;
}
body[class*="section-"] .wrap{
  background:linear-gradient(145deg,
    color-mix(in srgb,var(--section-color) 31%,#080808),
    color-mix(in srgb,var(--section-color) 17%,#080808) 58%,
    #0b0b0b);
  border:1px solid color-mix(in srgb,var(--section-color) 62%,#252525);
  border-top:3px solid var(--section-color);
  border-radius:25px;
  margin:22px auto 40px;
  padding:30px 34px 70px;
  box-shadow:0 12px 38px color-mix(in srgb,var(--section-color) 17%,transparent),0 18px 45px #0009;
}
body[class*="section-"] .pagehead{
  background:linear-gradient(110deg,
    color-mix(in srgb,var(--section-color) 43%,#101010),
    color-mix(in srgb,var(--section-color) 23%,#101010));
  border:1px solid color-mix(in srgb,var(--section-color) 75%,#333);
  border-left:6px solid var(--section-color);
  border-radius:20px;
  padding:22px 24px;
  margin-bottom:24px;
  box-shadow:inset 0 1px 0 #ffffff20,0 8px 24px #0005;
}
body[class*="section-"] .eyebrow{color:var(--section-color)}
body[class*="section-"] .card{
  background:linear-gradient(145deg,
    color-mix(in srgb,var(--section-color) 24%,#151515),
    color-mix(in srgb,var(--section-color) 12%,#101010));
  border:1px solid color-mix(in srgb,var(--section-color) 58%,#303030);
  border-radius:19px;
  box-shadow:inset 0 1px 0 #ffffff16,0 8px 22px #0006;
}
body[class*="section-"] .item{
  background:color-mix(in srgb,var(--section-color) 17%,#151515);
  border-color:color-mix(in srgb,var(--section-color) 48%,#303030);
  border-radius:14px;
}
body[class*="section-"] .btn.primary{
  background:var(--section-color);
  color:#080808;
  border-color:var(--section-color);
  box-shadow:0 4px 16px color-mix(in srgb,var(--section-color) 32%,transparent);
}
body[class*="section-"] .progress span,
body[class*="section-"] .bar{
  background:var(--section-color);
}
body[class*="section-"] input:focus,
body[class*="section-"] select:focus,
body[class*="section-"] textarea:focus{
  border-color:var(--section-color);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--section-color) 25%,transparent);
}
body[class*="section-"] .nav button.active{
  background:color-mix(in srgb,var(--section-color) 36%,#101010);
  border-color:var(--section-color);
  box-shadow:inset 4px 0 0 var(--section-color),0 0 18px color-mix(in srgb,var(--section-color) 20%,transparent);
}
body[class*="section-"] .nav button.active .ico{
  background:var(--section-color);color:#080808;
}
@media(max-width:760px){
  body[class*="section-"] .wrap{
    margin:12px 9px 28px;
    padding:20px 13px 48px;
    border-radius:21px;
  }
  body[class*="section-"] .pagehead{padding:18px 16px;border-radius:17px}
}


/* KSTUDY 1.5 — acabamento premium e otimização para notebook */
:root{
  --line:#303030;
  --surface:#111;
  --surface-raised:#171717;
  --surface-soft:#1c1c1c;
  --glass:rgba(12,12,12,.94);
}
html{scroll-behavior:smooth}
body{min-height:100vh;background:#080808}
.app{grid-template-columns:248px minmax(0,1fr);max-width:1920px;margin:0 auto}
.sidebar{
  padding:25px 15px 20px;
  background:linear-gradient(180deg,#101010 0%,#0a0a0a 100%);
  border-right:1px solid #292929;

<pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-soft);padding:14px;border-radius:10px;font-size:11px;color:inherit">create table public.kstudy_progress (
  user_id uuid primary key references auth.users(id) on delete cascade,
  payload jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.kstudy_progress enable row level security;
create policy "Cada usuário acessa apenas seu progresso"
on public.kstudy_progress for all
using (auth.uid() = user_id)
with check (auth.uid() = user_id);</pre>
<p class="tiny">Importante: não use uma senha igual à de outros serviços. A chave pública pode ficar no navegador; nunca coloque a chave secreta (service_role) no HTML. Seus dados antigos permanecem neste dispositivo até você escolher sincronizá-los.</p>

function ranking(){let m={};data.questions.forEach(x=>{let k=x.subject;m[k]??={a:0,t:0};m[k].a+=x.correct;m[k].t+=x.total});let arr=Object.entries(m).filter(([k,v])=>v.t>=5).sort((a,b)=>b[1].a/b[1].t-a[1].a/a[1].t);return arr.length?list(arr.slice(0,8),([k,v])=>`<div class="item"><strong>${esc(k)}</strong><b>${pct(v.a,v.t)}% <span class="meta">(${v.t} questões)</span></b></div>`):empty('Registre ao menos cinco questões por matéria para formar o ranking.')}
function taskList(ts){return ts.length?`<div class="list">${ts.map(x=>`<div class="item"><label class="checkrow"><input type="checkbox" data-task="${x.id}" ${x.done?'checked':''}><span><strong style="${x.done?'text-decoration:line-through;color:#899184':''}">${esc(x.name)}</strong><div class="meta">${x.category} · ${x.minutes} min · ${x.priority}</div></span></label><button class="btn small danger" data-taskdel="${x.id}">×</button></div>`).join('')}</div>`:empty('Nenhuma tarefa cadastrada para esta data.')}
function contentList(cs){return cs.length?`<div class="list">${cs.map(x=>`<div class="item"><div style="min-width:0"><strong>${esc(x.name)}</strong><div class="meta">${x.area} · ${x.subject} ${x.date?'· '+x.date:''}</div>${x.notes?`<div class="tiny">${esc(x.notes)}</div>`:''}</div><div class="row"><select data-status="${x.id}" style="width:auto;padding:7px">${options(['Não iniciado','Estudado','Domínio'],x.status)}</select><button class="btn small danger" data-contentdel="${x.id}">×</button></div></div>`).join('')}</div>`:empty()}
function reviewList(rs){return rs.length?`<div class="list">${rs.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${x.area} · ${x.subject} · ${x.type} · ${x.date}</div></div><div class="row"><span class="pill">${x.done?'Concluída':'Pendente'}</span><button class="btn small" data-review="${x.id}">${x.done?'Desfazer':'Concluir'}</button></div></div>`).join('')}</div>`:empty('As revisões serão criadas automaticamente ao marcar um conteúdo como estudado.')}
function addReviews(c){[1,7,30].forEach(n=>{let d=new Date((c.date||today())+'T12:00:00');d.setDate(d.getDate()+n);data.reviews.push({id:uid(),name:c.name,area:c.area,subject:c.subject,type:'D+'+n,date:d.toISOString().slice(0,10),done:false,contentId:c.id})})}
function wire(){
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
if(current==='timer')timerWire();
if(current==='routine')routineWire();
if(current==='content')contentWire();
if(current==='reviews')reviewWire();
if(current==='questions')$('#questionForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.total=+f.total;f.correct=+f.correct;if(f.correct>f.total||f.total<1)return toast('Confira o total e os acertos.');data.questions.push({...f,id:uid()});save();render();toast('Bloco registrado.')};
if(current==='simulados')$('#simForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));['ling','hum','nat','mat','essay'].forEach(k=>f[k]=+f[k]);if(['ling','hum','nat','mat'].some(k=>f[k]<0||f[k]>45)||f.essay<0||f.essay>1000)return toast('Confira os limites das pontuações.');data.simulados.push({...f,id:uid()});save();render();toast('Simulado salvo.')};
if(current==='errors'){$('#errorForm').onsubmit=e=>{e.preventDefault();data.errors.push({...Object.fromEntries(new FormData(e.target)),id:uid(),done:false});save();render();toast('Erro registrado.')};$$('[data-error]').forEach(b=>b.onclick=()=>{let x=data.errors.find(x=>x.id===b.dataset.error);x.done=!x.done;save();render()})}
if(current==='tools')toolsWire();
if(current==='mentor')mentorWire();
if(current==='account')accountWire();
$$('[data-del]').forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.del.split(':');if(confirm('Excluir este registro?')){data[k]=data[k].filter(x=>x.id!==id);save();render()}});
}
let tick=null,elapsed=0,started=0;
function timerWire(){let running=false;const clock=$('#clock');function paint(){let n=elapsed+(running?Math.floor((Date.now()-started)/1000):0);clock.textContent=[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')}
$('#startTimer').onclick=()=>{if(running)return;running=true;started=Date.now();$('#startTimer').disabled=true;$('#stopTimer').disabled=false;tick=setInterval(paint,250)};
$('#stopTimer').onclick=()=>{if(!running)return;elapsed+=Math.floor((Date.now()-started)/1000);clearInterval(tick);running=false;let mins=Math.max(1,Math.round(elapsed/60));data.sessions.push({id:uid(),date:today(),subject:$('#timerSubject').value,minutes:mins,origin:'Cronômetro'});save();elapsed=0;paint();$('#startTimer').disabled=false;$('#stopTimer').disabled=true;render();toast('Sessão salva no histórico.')}}
function routineWire(){const date=$('#routineDate');function refresh(){let ts=data.tasks[date.value]||[];$('#taskList').innerHTML=taskList(ts);$$('[data-task]').forEach(c=>c.onchange=()=>{let x=ts.find(x=>x.id===c.dataset.task);x.done=c.checked;save();routineRefreshStats()});$$('[data-taskdel]').forEach(b=>b.onclick=()=>{data.tasks[date.value]=ts.filter(x=>x.id!==b.dataset.taskdel);save();render()});$('#taskFilter').onchange=()=>{let f=$('#taskFilter').value;$('#taskList').innerHTML=taskList(ts.filter(x=>f==='all'||(f==='pending'&&!x.done)||(f==='done'&&x.done)||(f==='high'&&x.priority==='Alta')));routineWireChecks(ts)}}
function routineRefreshStats(){let ts=data.tasks[date.value]||[],d=ts.filter(x=>x.done).length;$('.pill').textContent=`${d}/${ts.length} concluídas · ${pct(d,ts.length)}%`;$('.progress span').style.width=pct(d,ts.length)+'%'}
function routineWireChecks(ts){$$('[data-task]').forEach(c=>c.onchange=()=>{ts.find(x=>x.id===c.dataset.task).done=c.checked;save();render()})}
$('#taskForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));(data.tasks[date.value]??=[]).push({...f,id:uid(),minutes:+f.minutes,done:false});save();render()};
date.onchange=refresh;$('#prevDay').onclick=()=>{let d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()-1);date.value=d.toISOString().slice(0,10);render()};$('#nextDay').onclick=()=>{let d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+1);date.value=d.toISOString().slice(0,10);render()};$('#todayBtn').onclick=()=>{date.value=today();render()};
$('#bulkDone').onclick=()=>{(data.tasks[date.value]||[]).forEach(x=>x.done=true);save();render()};$('#resetDay').onclick=()=>{if(confirm('Reiniciar o checklist deste dia?')){(data.tasks[date.value]||[]).forEach(x=>x.done=false);save();render()}};
$('#strategy').onchange=e=>{data.strategy=e.target.value;save()};$('#saveStrategy').onclick=()=>{data.strategy=$('#strategy').value;save();toast('Estratégia salva.')};
$('#baseForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.minutes=+f.minutes;data.base.push({...f,id:uid()});save();render()};
$('#reorganize').onclick=()=>{let available=+$('#available').value,start=$('#start').value||'08:00',items=[...data.base].sort((a,b)=>['Alta','Média','Baixa'].indexOf(a.priority)-['Alta','Média','Baixa'].indexOf(b.priority));let total=0,out=[];items.forEach(x=>{if(total<available){let [h,m]=start.split(':').map(Number),begin=h*60+m+total,end=begin+x.minutes;out.push(`<div class="item"><strong>${esc(x.name)}</strong><span class="meta">${String(Math.floor(begin/60)%24).padStart(2,'0')}:${String(begin%60).padStart(2,'0')} – ${String(Math.floor(end/60)%24).padStart(2,'0')}:${String(end%60).padStart(2,'0')} · ${x.priority}</span></div>`);total+=x.minutes}});$('#scheduleOut').innerHTML=out.join('')||empty('Adicione tarefas ao cronograma-base.');if(total>available)$('#scheduleOut').innerHTML+=`<p class="tiny">Tempo planejado: ${total} min. Foram distribuídas tarefas até o limite informado.</p>`}
refresh()}
function contentWire(){function filter(){let area=$('#contentFilter').value,s=$('#contentSearch').value.toLowerCase();$('#contentList').innerHTML=contentList(data.contents.filter(x=>(area==='Todas'||x.area===area)&&x.name.toLowerCase().includes(s)));$$('[data-status]').forEach(el=>el.onchange=()=>{let c=data.contents.find(x=>x.id===el.dataset.status),old=c.status;c.status=el.value;if(old==='Não iniciado'&&c.status!=='Não iniciado'){c.date=today();addReviews(c)}save();render();toast('Conteúdo e revisões atualizados.')});$$('[data-contentdel]').forEach(b=>b.onclick=()=>{if(confirm('Excluir conteúdo e suas revisões associadas?')){data.contents=data.contents.filter(x=>x.id!==b.dataset.contentdel);data.reviews=data.reviews.filter(x=>x.contentId!==b.dataset.contentdel);save();render()}})}
$('#contentFilter').onchange=filter;$('#contentSearch').oninput=filter;
$('#contentForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let c={...f,id:uid()};data.contents.push(c);if(c.status!=='Não iniciado'){c.date=c.date||today();addReviews(c)}save();render();toast('Conteúdo cadastrado.')};filter()}
function reviewWire(){function bind(){ $$('[data-review]').forEach(b=>b.onclick=()=>{let x=data.reviews.find(x=>x.id===b.dataset.review);x.done=!x.done;save();render()});$$('[data-reviewfilter]').forEach(b=>b.onclick=()=>{let f=b.dataset.reviewfilter;$('#reviewList').innerHTML=reviewList(data.reviews.filter(x=>f==='all'||(f==='pending'&&!x.done)||(f==='done'&&x.done)));bind()})}
$('#globalForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));data.reviews.push({id:uid(),name:f.name,area:f.area,subject:'Revisão integrada',type:f.type,date:f.date,done:false});save();render()};bind()}
function toolsWire(){$('#essayForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let score=0;for(let i=1;i<=5;i++){f['c'+i]=+f['c'+i];score+=f['c'+i]}data.essays.push({...f,id:uid(),score});save();render();toast('Nota de redação registrada.')};
function calc(){let t=+$('#calcTotal').value,c=+$('#calcCorrect').value,p=t?pct(c,t):0;$('#calcResult').textContent=p+'%';$('#calcBar').style.width=p+'%';$('#calcAdvice').textContent=p<50?'Retomar conceitos fundamentais':p<70?'Identificar padrões de erro':p<85?'Consolidar com questões variadas':'Manter revisões e praticar'}
$('#calcTotal').oninput=calc;$('#calcCorrect').oninput=calc;calc();
$('#doubtForm').onsubmit=e=>{e.preventDefault();data.doubts.push({...Object.fromEntries(new FormData(e.target)),id:uid(),done:false});save();render()};$$('[data-doubt]').forEach(b=>b.onclick=()=>{let x=data.doubts.find(x=>x.id===b.dataset.doubt);x.done=!x.done;save();render()})}
function mentorWire(){let log=$('#chatlog');log.scrollTop=log.scrollHeight;function respond(msg){let m=msg.toLowerCase(),q=sum(data.questions,'total'),a=sum(data.questions,'correct'),weak={};data.questions.forEach(x=>{weak[x.subject]??={a:0,t:0};weak[x.subject].a+=x.correct;weak[x.subject].t+=x.total});let low=Object.entries(weak).filter(([k,v])=>v.t>=5).sort((a,b)=>a[1].a/a[1].t-b[1].a/b[1].t)[0];let pending=data.reviews.filter(x=>!x.done).length,open=data.errors.filter(x=>!x.done).length;
if(m.includes('momento')||m.includes('analisar'))return `Seu painel atual mostra ${fmtMin(sum(data.sessions,'minutes'))} de estudo registrado, ${q} questões com ${pct(a,q)}% de aproveitamento, ${pending} revisões pendentes e ${open} erros em aberto. ${low?`A matéria com menor aproveitamento na amostra (mínimo de 5 questões) é ${low[0]}: ${pct(low[1].a,low[1].t)}%.`:'Ainda não há amostra suficiente para apontar uma matéria prioritária.'} Minha orientação: escolha uma prioridade, pratique questões e registre a causa dos erros.`;
if(m.includes('revis'))return `Você tem ${pending} revisões pendentes. Comece pelas vencidas e pelas que pertencem a conteúdos de maior dificuldade. Faça uma tentativa ativa antes de consultar o material e registre o que ainda não recuperou.`;
if(m.includes('erro'))return `Há ${open} erros em aberto. Separe-os por causa: conteúdo pede retomada conceitual; interpretação pede leitura do comando e evidências do texto; cálculo pede reconstrução das etapas; atenção/tempo pede ajuste de estratégia. Transforme cada erro em uma ação verificável.`;
if(m.includes('zero'))return 'Para aprender do zero: (1) identifique os pré-requisitos; (2) estude um bloco curto de teoria; (3) explique o conceito com suas palavras; (4) resolva questões fáceis; (5) corrija e avance gradualmente. Qual conceito específico você quer estudar?';
if(m.includes('planejar')||m.includes('sessão')||m.includes('melhor'))return `Sugestão de sessão: 10 min para definir objetivo e recuperar o que já sabe; 35–45 min de estudo ativo; 20–30 min de questões; 15 min de correção; 5 min para registrar dúvidas e próxima ação. Ajuste o tamanho ao tempo e à energia disponíveis.`;
if(m.includes('testar'))return 'Vamos testar compreensão: explique o assunto em 3 a 5 frases, sem consultar o material. Depois, eu posso ajudar a identificar lacunas na explicação.';
return `Posso orientar com base nos seus registros. Hoje há ${data.contents.filter(x=>x.status!=='Não iniciado').length} conteúdos iniciados, ${q} questões registradas e ${pending} revisões pendentes. Diga qual matéria ou dificuldade quer trabalhar e vamos por etapas.`}
function send(msg){if(!msg.trim())return;data.chat.push({role:'user',text:msg});let ans=respond(msg);data.chat.push({role:'bot',text:ans});save();render()}
$('#chatForm').onsubmit=e=>{e.preventDefault();send(new FormData(e.target).get('message'))};$$('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));$('#chatForm textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}}}

function setCloudStatus(t){let el=$('#cloudStatus');if(el)el.textContent=t}
function accountWire(){
 const cfg=JSON.parse(localStorage.getItem('kstudy_supabase_config')||'{}');
 $('#sbUrl').value=cfg.url||'';$('#sbKey').value=cfg.key||'';
 $('#authStatus').textContent=cloudUser?'Conectado: '+cloudUser.email:'Nenhuma conta conectada.';
 setCloudStatus(cloudClient?'Projeto conectado neste dispositivo.':'Projeto ainda não conectado neste dispositivo.');
 $('#connectCloud').onclick=async()=>{
  let url=$('#sbUrl').value.trim().replace(/\/+$/,''),key=$('#sbKey').value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))return setCloudStatus('URL inválida. Copie a Project URL completa, no formato https://seu-projeto.supabase.co');
  if(!key)return setCloudStatus('Cole a chave pública (Publishable key ou anon). Não use Secret key.');
  if(!window.supabase?.createClient)return setCloudStatus('A biblioteca do Supabase não carregou. Verifique a internet e recarregue a página.');
  const button=$('#connectCloud');button.disabled=true;button.textContent='Testando conexão…';
  try{
   const testClient=window.supabase.createClient(url,key);
   const {error}=await testClient.from('kstudy_progress').select('user_id').limit(1);
   if(error)throw error;
   cloudClient=testClient;
   localStorage.setItem('kstudy_supabase_config',JSON.stringify({url,key}));
   setCloudStatus('Conexão verificada! Agora entre ou crie sua conta KSTUDY.');
   toast('Supabase conectado e testado.');
  }catch(e){
   cloudClient=null;
   const msg=e?.message||'Erro desconhecido';
   setCloudStatus('Falha no teste: '+msg+'. Confira a Project URL, a chave pública e se a tabela kstudy_progress foi criada no SQL Editor.');
  }finally{button.disabled=false;button.textContent='Conectar projeto'}
 };
 $('#disconnectCloud').onclick=()=>{cloudClient=null;cloudUser=null;localStorage.removeItem('kstudy_supabase_config');setCloudStatus('Projeto desconectado neste dispositivo.');$('#authStatus').textContent='Entre com sua conta para sincronizar.';toast('Desconectado.')};
 $('#signUp').onclick=async()=>{if(!cloudClient)return toast('Conecte primeiro seu projeto Supabase.');let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||password.length<8)return toast('Informe e-mail e senha com pelo menos 8 caracteres.');const {data:d,error}=await cloudClient.auth.signUp({email,password});if(error)return $('#authStatus').textContent=error.message;cloudUser=d.user;if(d.session){$('#authStatus').textContent='Conta criada e conectada.';await cloudLoad(true)}else $('#authStatus').textContent='Conta criada. Confirme o e-mail enviado para ativá-la.'};
 $('#signIn').onclick=async()=>{if(!cloudClient)return toast('Conecte primeiro seu projeto Supabase.');let email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return toast('Informe e-mail e senha.');const {data:d,error}=await cloudClient.auth.signInWithPassword({email,password});if(error)return $('#authStatus').textContent=error.message;cloudUser=d.user;$('#authStatus').textContent='Conectado como '+cloudUser.email;await cloudLoad(false)};
 $('#signOut').onclick=async()=>{if(cloudClient)await cloudClient.auth.signOut();cloudUser=null;$('#authStatus').textContent='Sessão encerrada.';toast('Você saiu da conta.')};
 async function cloudLoad(isNew){
  if(!cloudClient||!cloudUser)return;
  const {data:row,error}=await cloudClient.from('kstudy_progress').select('payload,updated_at').eq('user_id',cloudUser.id).maybeSingle();
  if(error){$('#authStatus').textContent='Erro ao carregar dados: '+error.message;return}
  if(row?.payload){
   if(confirm('Encontramos um progresso salvo na nuvem ('+new Date(row.updated_at).toLocaleString('pt-BR')+'). Deseja carregar esse progresso e substituir os dados deste dispositivo?')){
    data={...fresh(),...row.payload};localStorage.setItem(KEY,JSON.stringify(data));render();applyTheme();$('#authStatus').textContent='Progresso da nuvem carregado com sucesso.';setCloudStatus('Sincronizado com a nuvem.');
   }else{$('#authStatus').textContent='Dados locais mantidos. Eles serão enviados à nuvem nas próximas alterações.';save()}
  }else{await cloudClient.from('kstudy_progress').upsert({user_id:cloudUser.id,payload:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});$('#authStatus').textContent='Conta conectada. Seu progresso local foi enviado à nuvem.';setCloudStatus('Sincronizado com a nuvem.')}
 }
}
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kstudy-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado.')};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||typeof d!=='object'||!Array.isArray(d.contents))throw Error();if(confirm('Importar backup e substituir os dados atuais deste navegador?')){data={...fresh(),...d};save();render();toast('Backup importado.')}}catch{toast('Arquivo de backup inválido.')}e.target.value=''};
function applyTheme(){document.body.classList.toggle('light',data.theme==='light');$('#themeBtn').textContent=data.theme==='light'?'☾ Escuro':'☼ Claro'}
$('#themeBtn').onclick=()=>{data.theme=data.theme==='light'?'dark':'light';applyTheme();save()};
$('#accountBtn').onclick=()=>go('account');
const savedCfg=JSON.parse(localStorage.getItem('kstudy_supabase_config')||'{}');
if(savedCfg.url&&savedCfg.key&&window.supabase?.createClient){
 try{cloudClient=window.supabase.createClient(savedCfg.url,savedCfg.key);cloudClient.auth.getSession().then(async({data:d})=>{if(d.session){cloudUser=d.session.user;const {data:row}=await cloudClient.from('kstudy_progress').select('payload').eq('user_id',cloudUser.id).maybeSingle();if(row?.payload){data={...fresh(),...row.payload};localStorage.setItem(KEY,JSON.stringify(data));if(current==='overview')render()}}})}catch(e){console.warn('Supabase:',e)}
}
applyTheme();save();render();
</script></body></html>
